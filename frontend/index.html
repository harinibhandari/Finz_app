<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finz — AI Financial Review</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2efe4;
    --paper-line: #e6e0cb;
    --surface: #fbfaf4;
    --ink: #21201b;
    --ink-soft: #6f6a56;
    --ink-faint: #a49d80;
    --rule: #d7d0b4;
    --rule-strong: #b9b190;
    --red: #a3312d;
    --red-bg: #f5e6e0;
    --green: #1d6a44;
    --green-bg: #e3eee3;
    --shadow: 2px 2px 0 rgba(33, 32, 27, 0.05);
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      var(--paper-line) 27px,
      var(--paper-line) 28px
    );
    color: var(--ink);
    margin: 0; padding: 0 24px 100px;
    font-size: 13.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header { max-width: 1000px; margin: 0 auto; padding: 44px 0 6px; }
  .masthead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .stamp {
    display: inline-block;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink);
    border: 2.5px solid var(--ink);
    padding: 2px 16px 6px;
    transform: rotate(-1.6deg);
    line-height: 1;
  }
  .masthead-sub {
    font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tear-line {
    margin: 20px 0 6px;
    border-top: 2px dashed var(--rule-strong);
    position: relative;
  }
  .tear-line::before, .tear-line::after {
    content: ""; position: absolute; top: -4px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--paper); border: 1.5px solid var(--rule-strong);
  }
  .tear-line::before { left: -3px; }
  .tear-line::after { right: -3px; }
  .sub { color: var(--ink-soft); font-size: 12.5px; }
  main { max-width: 1000px; margin: 0 auto; }
  section { margin-top: 34px; }
  h2 {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
    margin-bottom: 14px; font-weight: 700;
  }
  h2 .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; flex-shrink: 0;
    background: var(--surface); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 50%;
    font-family: "Big Shoulders Display", sans-serif;
    font-size: 15px; font-weight: 700;
  }
  .card {
    border: 1px solid var(--rule); border-top: 3px double var(--ink);
    border-radius: var(--radius);
    padding: 22px 24px; background: var(--surface); box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px dashed var(--rule); }
  th {
    color: var(--ink-soft); font-weight: 700; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 2px solid var(--ink);
  }
  tbody tr { transition: background 0.1s ease; }
  tbody tr:hover { background: var(--paper); }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: var(--radius);
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    border: 1.5px solid currentColor;
  }
  .pill.review { color: var(--red); background: var(--red-bg); }
  .pill.high { color: var(--green); background: var(--green-bg); }
  button {
    background: var(--ink); color: var(--surface); border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 8px 16px; font-family: inherit; font-size: 12px; cursor: pointer;
    font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    transition: background 0.12s ease, color 0.12s ease, transform 0.05s ease;
  }
  button:hover { background: var(--surface); color: var(--ink); }
  button:active { transform: scale(0.98); }
  button.secondary { background: var(--surface); color: var(--ink); }
  select, input[type=file], input[type=text] {
    font-family: inherit; font-size: 12.5px; padding: 7px 10px; border: 1.5px solid var(--rule-strong);
    border-radius: var(--radius); background: var(--surface); color: var(--ink);
  }
  select:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  input[type=text] { flex: 1; }
  input[type=text]::placeholder { color: var(--ink-faint); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .filters { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--rule); }
  #chatLog { max-height: 440px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  .msg { padding: 11px 15px; border-radius: var(--radius); margin-bottom: 10px; max-width: 82%; font-size: 12.5px; line-height: 1.55; }
  .msg.user {
    background: var(--ink); color: var(--paper); margin-left: auto; white-space: pre-wrap;
    transform: rotate(-0.3deg);
  }
  .msg.bot { background: var(--surface); border: 1.5px dashed var(--rule-strong); }
  .msg .tools { font-size: 10.5px; color: var(--ink-faint); margin-top: 8px; border-top: 1px dashed var(--rule); padding-top: 6px; }

  /* Markdown rendering inside bot messages */
  .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4 {
    margin: 12px 0 6px; font-weight: 700; line-height: 1.3;
    font-family: "Big Shoulders Display", sans-serif; letter-spacing: 0.01em;
  }
  .msg.bot h1:first-child, .msg.bot h2:first-child,
  .msg.bot h3:first-child, .msg.bot h4:first-child { margin-top: 0; }
  .msg.bot h3 { font-size: 16px; }
  .msg.bot h4 { font-size: 14px; }
  .msg.bot p { margin: 6px 0; }
  .msg.bot ul, .msg.bot ol { margin: 6px 0; padding-left: 20px; }
  .msg.bot li { margin: 3px 0; }
  .msg.bot strong { font-weight: 700; }
  .msg.bot table {
    margin: 10px 0; font-size: 11.5px; width: 100%;
    border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden;
  }
  .msg.bot th, .msg.bot td { padding: 6px 10px; border-bottom: 1px dashed var(--rule); }
  .msg.bot th { background: var(--paper); font-size: 10px; border-bottom: 2px solid var(--ink); }
  .msg.bot tr:last-child td { border-bottom: none; }
  .msg.bot code {
    background: var(--paper); padding: 1px 5px; border-radius: 2px;
    font-family: inherit; font-size: 11.5px; border: 1px solid var(--rule);
  }
  .msg.bot hr { border: none; border-top: 1px dashed var(--rule); margin: 10px 0; }

  .variance-card {
    border: 1px solid var(--rule); border-left: 4px solid var(--ink); border-radius: var(--radius);
    padding: 15px 18px; margin-bottom: 12px;
    background: var(--surface);
  }
  .variance-card.pos-flag { border-left-color: var(--green); }
  .variance-card.neg-flag { border-left-color: var(--red); }
  .variance-card:last-child { margin-bottom: 0; }
  .variance-title {
    font-weight: 700; margin-bottom: 6px; font-size: 12.5px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .variance-card > div:nth-child(2) { color: var(--ink); font-size: 12.5px; }
  .muted { color: var(--ink-soft); }
  .empty { color: var(--ink-faint); padding: 32px; text-align: center; font-size: 12.5px; }
  .badge-count {
    color: var(--red); background: var(--red-bg); border: 1.5px solid var(--red);
    padding: 2px 9px; border-radius: var(--radius); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; margin-left: 4px;
    display: inline-block; transform: rotate(-2deg);
  }
  .spinner {
    display: inline-block; width: 11px; height: 11px; border: 2px solid var(--rule);
    border-top-color: var(--ink); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="stamp">Finz</span>
    <span class="masthead-sub">Financial Review — NYC Restaurant Co.</span>
  </div>
  <div class="tear-line" aria-hidden="true"></div>
  <div class="sub">Raw transactions → categorized P&amp;L → explained variances → answered questions</div>
</header>

<main>
  <section>
    <h2><span class="step-num">1</span>Upload transactions</h2>
    <div class="card row">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <button onclick="uploadFile()">Ingest &amp; categorize</button>
      <span id="uploadStatus" class="muted"></span>
    </div>
  </section>

  <section>
    <h2><span class="step-num">2</span>Transactions <span id="reviewCount" class="badge-count" style="display:none"></span></h2>
    <div class="card">
      <div class="filters row">
        <select id="monthFilter" onchange="loadTransactions()"><option value="">All months</option></select>
        <select id="categoryFilter" onchange="loadTransactions()">
          <option value="">All categories</option>
          <option>Revenue</option><option>COGS</option><option>Payroll</option>
          <option>Operating Expenses</option><option>Non-P&L</option>
        </select>
        <select id="confidenceFilter" onchange="loadTransactions()">
          <option value="">All confidence</option>
          <option value="needs_review">Needs review only</option>
          <option value="high">High confidence only</option>
        </select>
      </div>
      <div id="txContainer" class="empty">Upload a file to see transactions.</div>
    </div>
  </section>

  <section>
    <h2><span class="step-num">3</span>Monthly P&amp;L</h2>
    <div class="card">
      <div id="pnlContainer" class="empty">No data yet.</div>
    </div>
  </section>

  <section>
    <h2><span class="step-num">4</span>Variances</h2>
    <div class="card">
      <div id="varianceContainer" class="empty">No data yet.</div>
    </div>
  </section>

  <section>
    <h2><span class="step-num">5</span>Ask the AI analyst</h2>
    <div class="card">
      <div id="chatLog"></div>
      <div class="row">
        <input type="text" id="chatInput" placeholder="e.g. Why did operating profit change between Feb and March?" style="flex:1" onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">Ask</button>
      </div>
    </div>
  </section>
</main>

<script>
const API = "";
let SUBCATEGORIES = [];
let chatHistory = [];

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  return res.json();
}

function fmt(n) {
  const v = Number(n);
  const s = Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (v < 0 ? "-$" : "$") + s;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function loadCategories() {
  const data = await api("/api/categories");
  SUBCATEGORIES = data.subcategories;
}

async function uploadFile() {
  const f = document.getElementById("fileInput").files[0];
  if (!f) { alert("Choose a file first"); return; }
  const status = document.getElementById("uploadStatus");
  status.innerHTML = '<span class="spinner"></span> Categorizing transactions (this calls the LLM for each batch, may take a bit)...';
  const fd = new FormData(); fd.append("file", f);
  try {
    const res = await api("/api/upload", { method: "POST", body: fd });
    status.textContent = `Ingested ${res.rows_ingested} transactions across ${res.months.length} months. ${res.needs_review} flagged for review.`;
    const monthSel = document.getElementById("monthFilter");
    monthSel.innerHTML = '<option value="">All months</option>' + res.months.map(m => `<option>${m}</option>`).join("");
    await Promise.all([loadTransactions(), loadPnl(), loadVariances()]);
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}

async function loadTransactions() {
  const month = document.getElementById("monthFilter").value;
  const category = document.getElementById("categoryFilter").value;
  const confidence = document.getElementById("confidenceFilter").value;
  const params = new URLSearchParams();
  if (month) params.set("month", month);
  if (category) params.set("category", category);
  if (confidence) params.set("confidence", confidence);
  let rows;
  try { rows = await api("/api/transactions?" + params.toString()); }
  catch (e) { return; }

  const allRows = await api("/api/transactions");
  const reviewCount = allRows.filter(r => r.confidence === "needs_review").length;
  const badge = document.getElementById("reviewCount");
  if (reviewCount > 0) { badge.style.display = "inline-block"; badge.textContent = reviewCount + " need review"; }
  else { badge.style.display = "none"; }

  const container = document.getElementById("txContainer");
  if (!rows.length) { container.innerHTML = '<div class="empty">No transactions match these filters.</div>'; return; }

  let html = `<table><thead><tr><th>Date</th><th>Description</th><th>Counterparty</th>
    <th class="num">Amount</th><th>Category</th><th>Confidence</th><th></th></tr></thead><tbody>`;
  for (const r of rows) {
    const amtClass = r.amount < 0 ? "neg" : "pos";
    const pill = r.confidence === "needs_review"
      ? `<span class="pill review">needs review</span>` : `<span class="pill high">high</span>`;
    html += `<tr>
      <td>${r.date}</td>
      <td>${r.description}${r.corrected ? ' <span class="muted">(corrected)</span>' : ''}</td>
      <td class="muted">${r.counterparty}</td>
      <td class="num ${amtClass}">${fmt(r.amount)}</td>
      <td>${r.subcategory || "-"}</td>
      <td>${pill}</td>
      <td><select onchange="correctTx('${r.id}', this.value)">
        <option value="">Recategorize…</option>
        ${SUBCATEGORIES.map(s => `<option ${s===r.subcategory?"selected":""}>${s}</option>`).join("")}
      </select></td>
    </tr>`;
  }
  html += "</tbody></table>";
  container.innerHTML = html;
}

async function correctTx(id, subcategory) {
  if (!subcategory) return;
  await api("/api/correct", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({transaction_id: id, subcategory})
  });
  await Promise.all([loadTransactions(), loadPnl(), loadVariances()]);
}

async function loadPnl() {
  const data = await api("/api/pnl");
  const container = document.getElementById("pnlContainer");
  if (!data.pnl.length) { container.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const cols = ["Revenue","COGS","Gross Profit","Payroll","Operating Expenses","Operating Profit"];
  let html = `<table><thead><tr><th>Month</th>${cols.map(c=>`<th class="num">${c}</th>`).join("")}</tr></thead><tbody>`;
  for (const row of data.pnl) {
    html += `<tr><td>${row.month}</td>${cols.map(c => {
      const cls = c === "Operating Profit" ? (row[c] >= 0 ? "pos" : "neg") : "";
      return `<td class="num ${cls}">${fmt(row[c])}</td>`;
    }).join("")}</tr>`;
  }
  html += "</tbody></table>";
  container.innerHTML = html;
}

async function loadVariances() {
  const container = document.getElementById("varianceContainer");
  container.innerHTML = '<div class="empty"><span class="spinner"></span> Analyzing variances…</div>';
  const data = await api("/api/variances");
  if (!data.variances.length) { container.innerHTML = '<div class="empty">No material variances detected.</div>'; return; }
  let html = "";
  for (const v of data.variances) {
    const dirClass = v.delta >= 0 ? "pos" : "neg";
    const flagClass = v.delta >= 0 ? "pos-flag" : "neg-flag";
    html += `<div class="variance-card ${flagClass}">
      <div class="variance-title">${v.line}: ${v.from_month} → ${v.to_month}
        <span class="${dirClass}">${v.delta >= 0 ? "+" : ""}${fmt(v.delta)} (${v.pct_change >= 0 ? "+" : ""}${v.pct_change}%)</span>
      </div>
      <div>${v.explanation || ""}</div>
      <div class="muted" style="margin-top:6px;font-size:11px;">Evidence: ${(v.evidence_transaction_ids||[]).join(", ")}</div>
    </div>`;
  }
  container.innerHTML = html;
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  const log = document.getElementById("chatLog");
  log.innerHTML += `<div class="msg user">${escapeHtml(q)}</div>`;
  log.innerHTML += `<div class="msg bot" id="pending"><span class="spinner"></span> Thinking…</div>`;
  log.scrollTop = log.scrollHeight;

  try {
    const res = await api("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q, history: chatHistory})
    });
    const rendered = marked.parse(res.answer || "");
    document.getElementById("pending").outerHTML = `<div class="msg bot">${rendered}
      ${res.tool_calls && res.tool_calls.length ? `<div class="tools">used: ${res.tool_calls.map(t=>t.tool).join(", ")}</div>` : ""}
    </div>`;
    chatHistory.push({role: "user", content: q});
    chatHistory.push({role: "assistant", content: res.answer});
  } catch (e) {
    document.getElementById("pending").outerHTML = `<div class="msg bot">Error: ${escapeHtml(e.message)}</div>`;
  }
  log.scrollTop = log.scrollHeight;
}

loadCategories();
</script>
</body>
</html>
